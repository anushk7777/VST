name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: build/LinenTests_artefacts/Release/LinenTests.exe

      # Loads this exact Linen.vst3 like a DAW: Clean must null bit for bit,
      # and no preset (Pain aside) may distort beyond -45 dB.
      - name: Null test and distortion check (the built VST3)
        run: build/LinenCheck_artefacts/Release/LinenCheck.exe build/Linen_artefacts/Release/VST3/Linen.vst3 --plot linen-null-test.png

      - name: Upload null test picture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linen-null-test
          path: linen-null-test.png
          if-no-files-found: ignore

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Linen-VST3-Windows
          path: build/Linen_artefacts/Release/VST3/

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: Linen-Standalone-Windows
          path: build/Linen_artefacts/Release/Standalone/Linen.exe

      - name: pluginval (strictness 5)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval is a GUI-subsystem app: PowerShell neither waits for it nor
          # sets $LASTEXITCODE, so start it explicitly and read its exit code.
          $pvArgs = @('--strictness-level', '5', '--validate-in-process', '--output-dir', 'pluginval-logs',
                    'build\Linen_artefacts\Release\VST3\Linen.vst3')
          $p = Start-Process -FilePath '.\pluginval\pluginval.exe' -ArgumentList $pvArgs -NoNewWindow -Wait -PassThru
          Write-Host "pluginval exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log
          path: pluginval-logs/
          if-no-files-found: ignore

  linux-tests:
    name: Linux DSP tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests, tools and the VST3
        run: cmake --build build --target LinenTests LinenRender LinenCheck Linen_VST3

      - name: Unit tests
        run: ./build/LinenTests_artefacts/Release/LinenTests

      - name: Null test and distortion check (the built VST3)
        run: ./build/LinenCheck_artefacts/Release/LinenCheck build/Linen_artefacts/Release/VST3/Linen.vst3
