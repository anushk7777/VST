name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: build/LinenTests_artefacts/Release/LinenTests.exe

      - name: pluginval (strictness 5)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --output-dir pluginval-logs "build\Linen_artefacts\Release\VST3\Linen.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Linen-VST3-Windows
          path: build/Linen_artefacts/Release/VST3/

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: Linen-Standalone-Windows
          path: build/Linen_artefacts/Release/Standalone/Linen.exe

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log
          path: pluginval-logs/
          if-no-files-found: ignore

  linux-tests:
    name: Linux DSP tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests and render tool
        run: cmake --build build --target LinenTests LinenRender

      - name: Unit tests
        run: ./build/LinenTests_artefacts/Release/LinenTests
